:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--pn:rgba(28,40,39,.95);--ink:#e3ece9;--acc:#d9a21b;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--pn:rgba(14,34,32,.94);--ink:#e6f2ef;--acc:#f0b429;color-scheme:dark}}
:root[data-theme="dark"]{--pn:rgba(14,34,32,.94);--ink:#e6f2ef;--acc:#f0b429;color-scheme:dark}
html,body{height:100%;margin:0;overflow:hidden;background:#8fd3e8;font-family:Cairo,"Segoe UI",Tahoma,sans-serif;color:var(--ink);touch-action:none}
#cv{position:fixed;inset:0;width:100%;height:100%}
#top{position:fixed;top:0;left:0;right:0;display:flex;gap:4px;padding:calc(env(safe-area-inset-top,0px) + 6px) 6px 6px;overflow-x:auto;direction:rtl}
.ch{background:var(--pn);border:2px solid;border-radius:12px;padding:2px 8px;font-size:12px;white-space:nowrap;text-align:center}
.ch.on{outline:3px solid var(--acc);transform:scale(1.06)}.ch.out{opacity:.35}
#ctl{position:fixed;right:8px;top:calc(env(safe-area-inset-top,0px) + 62px);display:flex;flex-direction:column;gap:6px}
#ctl button{width:38px;height:38px;padding:0;border-radius:50%;background:var(--pn);color:var(--ink);font-size:17px;box-shadow:0 2px 8px #0004}
#bot{position:fixed;bottom:0;left:0;right:0;background:var(--pn);padding:6px 10px calc(env(safe-area-inset-bottom,0px) + 8px);border-radius:18px 18px 0 0;direction:rtl;font-size:13px;box-shadow:0 -4px 18px #0003}
#row{display:flex;gap:6px;align-items:center}
#dwo{perspective:420px;padding:10px 12px}
#dw{display:flex;gap:18px;transform-style:preserve-3d;transform:rotateX(-20deg) rotateY(-20deg)}
.cube{width:42px;height:42px;position:relative;transform-style:preserve-3d;transition:transform 1.1s cubic-bezier(.15,.8,.25,1)}
.f{position:absolute;inset:0;background:#cfc9b6;border:1px solid #bbb;border-radius:8px;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:5px;box-shadow:inset 0 0 8px #0003}
.f i{background:#222;border-radius:50%;margin:1px}.f1 i{background:#c0392b}
.f1{transform:translateZ(21px)}.f2{transform:rotateY(90deg) translateZ(21px)}.f3{transform:rotateX(90deg) translateZ(21px)}.f4{transform:rotateX(-90deg) translateZ(21px)}.f5{transform:rotateY(-90deg) translateZ(21px)}.f6{transform:rotateY(180deg) translateZ(21px)}
#btns{display:flex;flex-wrap:wrap;gap:6px;flex:1}
#log{font-size:11px;opacity:.8;min-height:2.6em}
button,select{font:inherit}
button{font-weight:700;padding:7px 11px;border:0;border-radius:10px;background:var(--acc);color:#1a1300}
button.g{background:#8883;color:var(--ink)}
button:focus-visible,select:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
#md{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:5;direction:rtl}
#md:empty{display:none}
.card{background:var(--pn);border-radius:18px;padding:14px;min-width:250px;max-width:92vw;max-height:82vh;overflow:auto;display:flex;flex-direction:column;gap:8px;text-align:center;color:var(--ink)}
.card h2{margin:0}
.deed{background:#d9cfb6;color:#2b2b2b;border:3px double #7a5c1e;box-shadow:0 10px 40px #0007}
.band{padding:10px;border-radius:8px;color:#fff;font-weight:900;font-size:20px;text-shadow:0 1px 3px #0009}
.pr{font-size:20px;font-weight:900}.pr small{font-size:12px;font-weight:400}
table{width:100%;border-collapse:collapse;font-size:13px}td{padding:3px 6px;border-bottom:1px solid #8884}td+td{text-align:left;font-weight:700}.hl td{background:#e6cf86;color:#2b2b2b}
.acts{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.deed button.g{color:#2b2b2b}
label{display:flex;justify-content:space-between;gap:12px;align-items:center}select{padding:6px;border-radius:8px}
.big{font-size:34px;font-weight:900;line-height:1.1}

.masc{flex:none;filter:drop-shadow(0 8px 10px #0008)}
.masc .lid{transform-box:fill-box;transform-origin:center;animation:blk 5s infinite}
@keyframes blk{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.bub{max-width:190px;background:var(--pap);color:#3a2300;font-weight:700;font-size:14px;line-height:1.5;padding:10px 12px;border-radius:16px 16px 4px 16px;margin-bottom:46px;text-align:right}
.mh.sm .bub{font-size:13px;margin-bottom:26px}
@media(prefers-reduced-motion:reduce){.masc .lid{animation:none}}
/* الرئيسية */
.hx .tt{font-size:min(15vw,70px);margin:6px 0 0;animation:none}
.hx .sb{margin:0 0 14px;color:var(--zel);font-weight:700}
.idc{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:20px;background:#f6e7c112;border:1.5px dashed #e9a23b88;text-align:right;cursor:pointer}
.ib{flex:1;min-width:0}.ib b{display:block;font-size:18px}.ib small{color:#f6e7c1aa}
.hbtn.go{background:linear-gradient(#ff7a55,var(--tom) 55%,#b92a14);color:#fff;box-shadow:0 5px 0 #6e1608,0 12px 24px #0008;font:400 24px Lalezar,Cairo;margin:14px 0}
.hbtn.go:active{box-shadow:0 2px 0 #6e1608}
.tl{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tl button{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:14px 8px;min-height:0;font:700 16px Cairo;color:var(--pap);background:#ffffff0f;border:1px solid #f6e7c133;border-radius:18px;box-shadow:0 4px 0 #0005;text-shadow:none;backdrop-filter:none}
.tl button:active{transform:translateY(3px);box-shadow:0 1px 0 #0005}
.tl button i{font-style:normal;font-size:34px;line-height:1.1}
.tl .wd{grid-column:1/3;flex-direction:row;justify-content:center;gap:10px;padding:12px}
.tl .wd i{font-size:26px}
.tl em{position:absolute;top:6px;left:8px;min-width:22px;height:22px;border-radius:11px;background:var(--tom);color:#fff;font:900 13px/22px Cairo;font-style:normal}
/* باقي صفحات القائمة */
.hb{position:sticky;top:0;z-index:3;margin:-12px -12px 12px;padding:12px;background:linear-gradient(#0a2430f2 75%,#0a243000)}
.hb h2{font-family:"Aref Ruqaa",Lalezar,Cairo;font-size:30px;color:var(--brass)}
.hb button{border-radius:14px;border:1px solid #f6e7c144;background:#f6e7c11a;color:var(--pap);font-weight:700}
.gbw{background:var(--nile);border:1px solid #e9a23b66;color:#ffd98a}
.tabs button.on,.it button,.mi button{background:var(--brass);color:#2a1700}
.it{background:#f6e7c10d;border:1.5px dashed #f6e7c13d}
.it.eq{border:1.5px solid var(--zel);box-shadow:0 0 0 3px #2bb3a344}
.dl{background:var(--tom)}
.bar i{background:linear-gradient(90deg,var(--zel),var(--brass))}
.mi{border:1px solid #f6e7c126;border-right:5px solid var(--brass)}
.sts div{border:1px solid #f6e7c122}.sts b{color:var(--brass)}
#hm input:focus{outline:3px solid var(--zel);border-color:var(--zel)}
/* لوبي الدخول وغرفة الانتظار */
.lob{background:radial-gradient(120% 60% at 50% 0,#14505a,#0a2430 62%);border:2px solid var(--brass);outline:1.5px dashed #e9a23b66;outline-offset:-9px}
.lob .sec{font:400 18px Lalezar,Cairo;color:var(--brass);border:0;display:flex;align-items:center;gap:8px}
.lob .sec::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,#e9a23b66,transparent)}
.lob button[onclick="goLocal()"]{background:linear-gradient(#ff7a55,var(--tom) 55%,#b92a14);color:#fff;text-shadow:none;border:0;box-shadow:0 4px 0 #6e1608}
.lob button[onclick="mkRoom()"]{background:#e9a23b22;border:1.5px solid var(--brass);color:#ffe3a6;text-shadow:none}
.lob .kr{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:14px;background:#f6e7c114;text-align:right}

dX:["الزهر مش بيفضح الكذب 🤥","كل رمية بتحكي قصة! 📖","خلّي بالك من الخانة اللي جاية 👀","الأرقام مش بتعرف تكدب 🧮","هتروح فين يا {n}؟ سؤال بملايين 💭","نفس الجدّية اللي كنت بتلعب بيها… ركّز! 🎯","الزهر بيلفّ وإنت بتتفرج 🌀","اللعب مش بس نرد… ده ذكاء 🧠","شد حيلك… وخلّي الباقي على ربنا 🙏","ده نرد بيلعب بالقلوب مش بس بالأرقام 💓","خطوة بخطوة والدنيا بتتحرك 👣","نرد جديد، حظ جديد! 🎲"],
turn:["الدور عليك يا {n}… دي لحظتك! 🌟","الكل ساكت وبيتفرج على {n} 🤫","{n}… وريني شطارتك المرة دي 😎","ماتفكرش كتير يا {n}، ارمي! 🎲","الجولة دي إما تبنيك إما تهدّك 💥","يلا يا بطل، العالم مستنيك 🌍","استعد للمغامرة اللي جاية 🚀","الحارة كلها مركّزة معاك يا {n} 👀","كل واحد وأيامه… ودورك دلوقتي ⏳","أنا حاسس إن هتحصل حاجة كبيرة 🔮","شغّل مخّك مش إيدك بس 🧠","والله لو {n} كسب هنعمل حفلة 🎉"],
idle:["إنت فين؟ أنا زهقت أستنّى 😴","الدنيا هادية بتخوّف… في حاجة جاية؟ 😬","اللي ساكت عنده خطة ولا نايم؟ 🤔","حد يحرّك أي حاجة بقى! 🏃","الجو هادي… حاجة بتتدبّر! 🕵️","أنا بتفرّج على السقف من الملل 🙄","النرد شكله اتعطّل! 🎲","أنا بكلّم نفسي هنا لوحدي 🗣️","لو سكتم أكتر هرقص! 💃","الوقت بيجري وإنتوا قاعدين! ⏰","يلا يا شباب نشوف الحركة 🔥","مش هتلعبوا؟ طيب هأكل سندوتشي 🥪"]};
for(const k in XQ)Q[k].push(...XQ[k]);
const TR={buyH:3,buyL:2,rentB:2,dX:2,turn:2,idle:2,build:2,buyM:2,buyC:1,theft:1,jail:1};for(const k in TR)Q[k].length-=TR[k];
const fm=(s,o)=>s.replace(/\{n\}/g,o.n||"يا بطل").replace(/\{p\}/g,o.p||"البيت").replace(/\{\$\}/g,o.a||""),LAST={};
const pick=(k,o)=>{const a=Q[k];let i=Math.floor(Math.random()*a.length);if(a.length>1&&i===LAST[k])i=(i+1)%a.length;LAST[k]=i;return fm(a[i],o||{})};
const nm=()=>(P[cur]&&P[cur].n)||"يا بطل";
let PR=null;const tiers=()=>{if(!PR){const a=B.filter(s=>s.price).map(s=>s.price).sort((x,y)=>x-y);PR={lo:a[Math.floor(a.length*.33)],hi:a[Math.floor(a.length*.75)],rent:a[Math.floor(a.length/2)]*.12}}return PR};
const tier=p=>{const t=tiers();return p<=t.lo?"L":p>=t.hi?"H":"M"};
/* --- عبسي نفسه (الظهور + الأولوية) --- */
let mqOn=true,mqt,curPr=0,until=0,since=0,lastAct=Date.now();try{mqOn=localStorage.getItem("absi_mq")!=="0"}catch(e){}
document.body.insertAdjacentHTML("beforeend",'<div id="mq"><div id="mqm" onclick="mqT()">'+MASC(48)+'</div><div id="mqb"></div></div>');
$("#mq").style.opacity=mqOn?1:.45;
const rx=window.rx=(t,h,pr)=>{if(!mqOn||!t)return;pr=pr==null?1:pr;const n=Date.now();if(n<until&&(pr<curPr||(pr===curPr&&n-since<1200)))return;
const m=$("#mqm"),b=$("#mqb");m.innerHTML=(h?MH:MASC)(48);b.textContent=t;b.className="on";curPr=pr;since=lastAct=n;until=n+Math.min(5500,2400+t.length*45);clearTimeout(mqt);mqt=setTimeout(()=>{b.className="";m.innerHTML=MASC(48);curPr=0},until-n)};
window.mqT=()=>{mqOn=!mqOn;try{localStorage.setItem("absi_mq",mqOn?1:0)}catch(e){}$("#mq").style.opacity=mqOn?1:.45;if(mqOn)rx("رجعت أعلّق 😎",1,3)};
const say2=(k,h,pr,o)=>rx(pick(k,Object.assign({n:nm()},o)),h,pr);
/* --- أحداث السجل (HIST) --- */
const RL=[
[/^⏳/,()=>null],
[/^🌍 اشتريت (.+) بـ(\d+)/,m=>["buyC",1,2,{p:m[1],a:m[2]}]],
[/^اشتريت (.+) بـ(\d+)/,m=>{const k=tier(+m[2]);return["buy"+k,k!=="L",2,{p:m[1],a:m[2]}]}],
[/^بنيت/,()=>["build",1,2]],[/^رهنت/,()=>["mort",0,2]],[/^بعت/,()=>["sell",0,2]],
[/٣ أزواج/,()=>["jail3",0,2]],[/رحت السجن/,()=>["jail",0,2]],[/خرجت من السجن|دفعت .{1,5} وخرجت/,()=>["free",1,2]],[/لسه في السجن/,()=>["still",0,1]],
[/ضريبة/,()=>["tax",0,2]],[/عديت البداية/,()=>["start",1,2]],[/مرهونة/,()=>["mortr",1,1]],
[/دفعت (\d+)/,m=>{const r=+m[1],t=tiers().rent,k=r<t*.8?"rentS":r>t*2.2?"rentB":"rentM";return[k,k==="rentS",2,{a:m[1]}]}],
[/كرت الحماية/,()=>["shield",1,2]],[/اتحرق|😭 خسرت/,()=>["lose",0,2]],[/🎁 كسبت/,()=>["gain",1,2]],
[/هاجم|احتلال/,()=>["war",0,2]],[/سرق/,()=>["theft",0,2]],[/دخل دولك/,()=>["income",1,1]],[/🏦/,()=>["bank",1,2]],[/🍽️/,()=>["food",1,1]],
[/🚆|🚌/,()=>["trans",1,1]],[/💼 خصم/,()=>["merch",1,1]],[/🏨.*اشترك/,()=>["hotel",1,2]],[/🏨.*قاعد/,()=>["hotelI",1,1]],[/ملكش مدن/,()=>["safe",1,1]]];
let hc=0,lc=-1;
setInterval(()=>{$("#mq").style.display=P.length?"flex":"none";if(!P.length)return;
const n=HIST.length;if(n<hc)hc=0;
if(n>hc){let best=null;for(const t of HIST.slice(Math.max(hc,n-4),n)){if(typeof t!=="string")continue;for(const r of RL){const m=r[0].exec(t);if(m){const v=r[1](m);if(v&&(!best||v[2]>=best[2]))best=v;break}}}hc=n;if(best)say2(best[0],best[1],best[2],best[3])}
if(cur!==lc){if(lc>=0&&Math.random()<.6)say2("turn",1,0);lc=cur}
if(Date.now()-lastAct>26000){say2("idle",0,0);lastAct=Date.now()}},350);
/* --- كروت، نرد، ووصول على خانة --- */
try{const _sc=showCard;showCard=function(t){say2({L:"cardL",T:"cardT",N:"cardN"}[t],t==="L",2);return _sc.apply(this,arguments)}}catch(e){}
try{const dm=/🎲 (\d+) \+ (\d+) = (\d+)/;new MutationObserver(()=>{const m=dm.exec($("#msg").textContent);if(!m)return;const a=+m[1],b=+m[2],s=a+b;say2(s===12?"d12":s===2?"d2":a===b?"dD":s===7?"d7":"dX",s!==2,0)}).observe($("#msg"),{childList:true,characterData:true,subtree:true})}catch(e){}
try{const _ld=land;land=function(p){try{const s=B[p.pos],o={n:p.n,p:s.name,a:s.price},LD={P:"LP",J:"LJ",S:"LS",H:"LH",M:"LM",R:"LR",Y:"LY"};
if(s.price){const w=own[p.pos];if(w<0)say2("land"+tier(s.price),1,1,o);else if(w===P.indexOf(p))say2("landMine",1,1,o)}else if(LD[s.t])say2(LD[s.t],1,1,o)}catch(e){}return _ld.apply(this,arguments)}}catch(e){}
})();
</script>

<script id="absi-explain">
(function(){
var AX=[
["🐪","أنا عبسي!","أنا <b>عبسي</b>… الجمل المكشّر اللي شايف الدنيا كلها غلط 😒. بس هشرحلك اللعبة من الألف للياء، فركّز معايا.<br>اللعبة اسمها <b>«عبسي وحظ»</b>: بتلف على البورد، تشتري مدن، تبني عليها، وتاخد إيجار من اللي ينزل عندك 💰. وآخر واحد ما أفلسش هو اللي بيكسب 🏆.<span class=\"tip\">💵 كل لاعب بيبدأ بـ <b>٢٥٠٠ 🪙</b></span>"],
["🎲","دورك يا بطل","ترمي النرد 🎲🎲 وتمشي بمجموع الرقمين. وبعدين بتتصرف في الخانة اللي نزلت عليها: تشتري، تدفع، أو تسحب كرت.<br>جبت <b>زوج</b> (نفس الرقم في النردين)؟ ارمي تاني 🔥. بس خلي بالك: <b>٣ أزواج ورا بعض = السجن!</b> 😈<span class=\"tip\">🏁 كل ما تعدّي على «البداية» بتاخد <b>٥٠٠ 🪙</b> ببلاش. أنا مش بدّي حاجة ببلاش، بس البنك كريم.</span>"],
["🏙️","المدن","نزلت على مدينة مالهاش صاحب؟ دوس <b>اشترِ</b> وبقت بتاعتك. أي حد ينزل عليها بعد كده <b>يدفعلك إيجار</b> 😏.<br>عايز تعرف سعر مدينة وإيجارها؟ <b>دوس على أي مدينة في البورد</b> وهيطلعلك كرتها: السعر، الإيجار، وسعر الرهن.<span class=\"tip\">🎨 لو جمعت كل مدن اللون الواحد (٣ مدن)، الإيجار الأساسي بيتضاعف وتقدر تبني. مش عارف ناقصك إيه؟ افتح 📜 أملاكي ← 📖 مرجع المجموعات.</span>"],
["🏠","البناء","الفلوس بتعمل فلوس. ابنِ على مدنك والإيجار هيطير:<br>🏠 بيت ← 🚗 جراج ← ⛺ استراحة ← 🏪 محل ← 🏬 سوق.<br>كل مستوى إيجاره أغلى من اللي قبله، وسعر البناء بيظهر في كرت المدينة.<span class=\"tip\">☕ الأندية (زي القهوة) ليها إضافاتها الخاصة: بلايستيشن 🎮، كراسي 🪑، شاشات 📺. والمنطقة الشعبية 🏘️ بيوت بس لحد ٣.</span>"],
["💸","الرهن والبيع والإفلاس","محتاج فلوس بسرعة؟ من كرت المدينة تقدر <b>ترهنها</b> وتاخد نص سعرها وتفكها بعدين، أو <b>تبيعها</b> للبنك. المباني بتتباع الأول.<br>وأنا بقولك بصراحة… لو فلوسك نزلت تحت الصفر <b>بتفلس 😭 وتطلع من اللعبة</b> وأملاكك بترجع للبنك.<span class=\"tip\">⚠️ المدينة المبنية مبتترهنش قبل ما تبيع مبانيها.</span>"],
["🃏","حظ ومحكمة ونحس","<b>🃏 الحظ:</b> كرت فلوس أو هدية أو حركة.<br><b>⚖️ المحكمة:</b> غرامة أو تعويض أو سجن.<br><b>💀 النحس:</b> تدفع، أو تخسر ملك، أو مبنى يتحرق 🔥.<br><b>💸 الضريبة:</b> ٢٥٠ 🪙 للبنك.<br><b>🏦 البنك:</b> بتاخد فلوس عشوائية من ١٠٠ لـ ٦٠٠ 🪙.<span class=\"tip\">يا رب النحس يعدّي. أنا شخصيًا بقالي سنين مش عدّى.</span>"],
["🔒","السجن","لو نزلت على <b>🚔 ادخل السجن</b> بتتحبس على طول.<br>وتخرج بواحدة من ٣:<br>١) تجيب <b>زوج</b> في النرد 🎲🎲<br>٢) تدفع <b>١٠٠ 🪙</b><br>٣) تخلّص <b>٣ محاولات</b>"],
["🏨","الأماكن الخاصة","<b>🏨 الفندق:</b> اشترك بـ ٦٠٠ 🪙 واقعد ٣ جولات وخد ٢٥٠ 🪙 كل جولة.<br><b>☕ ميدان أبو عمار:</b> اقعد لحد ٤ جولات، وانت قاعد <b>محدش يحاربك</b> ولا يلمس أملاكك 🛡️.<br><b>🦁 حديقة الحيوان:</b> أطعم حيوان من ٥، وكل ما كبر الحيوان كبرت فرصتك تكسب مدينة.<br><b>🍽️ المطعم:</b> أكلة بتدّيك كرت حماية لمرة واحدة.<br><b>🚌 🚆 الأتوبيس والقطار:</b> بيوصّلوك لمحطة تانية.<br><b>🏥 مستشفى المجانين وسجن أبو كربة:</b> بتختار لاعب يقعد معاك.<span class=\"tip\">🥷 فيه كمان <b>المافيا</b>: تأجّر حرامي يسرقلك، بس النجاح مش مضمون!</span>"],
["🌍","الدول","فيه <b>٢٠ دولة</b> بتتباع. كل دولة بتشتريها <b>بتدّيك فلوس كل دور</b> 🤑، وأغلى دولة بتدّي أكتر.<br>افتح قايمة الدول، شوف السعر والدخل لكل دولة، ودوس اشترِ. وفيه زرار 👁 يوريك الدولة على البورد.<span class=\"tip\">⚔️ أول دولة تشتريها بتفتحلك <b>الحرب</b>.</span>"],
["⚔️","الحرب","اشترِ <b>جنود 🪖</b> (١٠ 🪙 للواحد) و<b>أسلحة 🔫</b> (١٥ 🪙 للواحد). وبعدين اختار مدينة أو دولة تغزوها. كل هدف محتاج عدد معين من الجنود والأسلحة بالتساوي.<br>الاحتلال بياخد <b>٣ جولات</b>، والجنود والدبابات بتمشي على البورد قدام الكل 🪖🚜.<span class=\"tip\">🛡️ <b>الدفاع:</b> كل مستوى دفاع بيزوّد الجيش اللازم لاحتلال ملكك ٢٥٪، لحد ٣ مستويات.</span>"],
["🤝","التبادل","عايز مدينة صاحبك؟ ادخل <b>التبادل</b> 🤝: اختار اللاعب، حط اللي هتدّيه واللي عايزه، وزوّد أو انقص فلوس لو حابب. وبعدين تعرض الصفقة.<br>هو يضغط <b>موافق ✅</b> أو <b>رفض ❌</b>.<span class=\"tip\">المدن المبنية أو المرهونة أو المحتلة مش بتتبدل.</span>"],
